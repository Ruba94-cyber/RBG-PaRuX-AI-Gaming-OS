# Opt-in verification for the gameplay-presets draft branch.
# Runs on ephemeral GitHub-hosted Windows only. Does not sign, publish, release,
# modify the user's PC, or use repository secrets.
name: PR16 - Windows gameplay mod checks

on:
  push:
    branches:
      - feat/ai-gameplay-batch-mods-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr16-gameplay-mods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Windows .NET 10 server build and mod security tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout unprivileged draft source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK and host
        run: |
          dotnet --info

      - name: Restore focused test and server dependencies
        run: |
          dotnet restore tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -p:Platform=x64

      - name: Build server and tests (real C# compilation)
        run: |
          dotnet build tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-restore --nologo

      - name: Run mod unit tests and owner-only security regressions
        run: |
          dotnet test tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --filter "FullyQualifiedName~TemporaryGameModServiceTests|FullyQualifiedName~LibraryAgentToolsTests|FullyQualifiedName~BrowserOwnerAndLanHardeningTests" --blame-hang --blame-hang-timeout 4m --logger "trx;LogFileName=gameplay-mod-tests.trx" --results-directory TestResults

      - name: Publish synthetic test result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-gameplay-mod-tests
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
