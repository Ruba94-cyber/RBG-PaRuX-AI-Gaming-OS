# Read-only validation of the canonical release-gate safety policy.
# Does NOT package, sign, upload, release or access user credentials.
name: CI validation policy and non-Windows gate self-test

on:
  push:
    branches:
      - fix/ci-validation-release-gate-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy-selftest:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Server test graph
        run: dotnet restore tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -p:Platform=x64
      - name: Compile Server tests
        run: dotnet build tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-restore --nologo
      - name: Verify non-Windows release fail-closed self-test
        run: |
          dotnet test tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --filter "FullyQualifiedName~ValidationScriptSelfTests.Release_gate_on_a_non_Windows_host_fails" --blame-hang --blame-hang-timeout 4m --logger "trx;LogFileName=ci-release-gate-selftest.trx" --results-directory TestResults
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-gate-selftest
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
