# Focused Windows regression for issues seen in PR17 full xUnit.
# Synthetic tests only: no signatures, packages, releases or real user data.
name: Integration - focused CI failure repairs
on:
  push:
    branches:
      - fix/integration-routing-regressions-20261123
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore test project
        run: dotnet restore tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -p:Platform=x64
      - name: Build actual integrated Server tests
        run: dotnet build tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-restore --nologo
      - name: Re-run the originally failing tests and BLF regressions
        run: |
          dotnet test tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --filter "FullyQualifiedName~MediaCapabilityRoutingTests|FullyQualifiedName~ModelDownloadServiceTests|FullyQualifiedName~GameModDropInServiceTests|FullyQualifiedName~WebSessionRouteDecisionTests|FullyQualifiedName~CanTraceExtractorTests" --blame-hang --blame-hang-timeout 4m --logger "trx;LogFileName=integration-failure-repairs.trx" --results-directory TestResults
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-repairs
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
