# Read-only Windows gate for the integration branch. No release, package,
# signing, real games, user data or credential-dependent operations.
name: PR17 - Integrated Windows merge gates

on:
  push:
    branches:
      - integration/20261123-b
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr17-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  desktop-build:
    name: Integrated WinUI Desktop Release x64
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Desktop graph
        run: dotnet restore src/PaRuX.App/PaRuX.App.csproj -p:Platform=x64
      - name: Compile actual integrated Desktop source
        run: dotnet build src/PaRuX.App/PaRuX.App.csproj -c Release -p:Platform=x64 --no-restore --nologo

  focused-server:
    name: Integrated Server build and priority regressions
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore tests and Server
        run: dotnet restore tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -p:Platform=x64
      - name: Compile integrated Server and tests
        run: dotnet build tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-restore --nologo
      - name: Run Playnite, controller, mod and Corporate priority regressions
        run: |
          dotnet test tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --filter "FullyQualifiedName~PlayniteComponentTests|FullyQualifiedName~PlayniteForegroundAdmissionTests|FullyQualifiedName~PlayniteGameSessionTrackerTests|FullyQualifiedName~PadActionTests|FullyQualifiedName~TemporaryGameModServiceTests|FullyQualifiedName~LibraryAgentToolsTests|FullyQualifiedName~BrowserOwnerAndLanHardeningTests|FullyQualifiedName~CorporateCpuMemoryPlannerTests|FullyQualifiedName~CorporateIdleRetrievalReclamationTests|FullyQualifiedName~MultilingualE5" --blame-hang --blame-hang-timeout 4m --logger "trx;LogFileName=integration-focused.trx" --results-directory TestResults
      - name: Preserve synthetic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr17-focused-tests
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  full-server:
    name: Integrated Server complete xUnit regression
    needs: [desktop-build, focused-server]
    runs-on: windows-latest
    timeout-minutes: 95
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore complete Server test graph
        run: dotnet restore tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -p:Platform=x64
      - name: Compile complete Server test graph
        run: dotnet build tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-restore --nologo
      - name: Run full xUnit suite with bounded hang detection
        run: |
          dotnet test tests/PaRuX.Server.Tests/PaRuX.Server.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --blame-hang --blame-hang-timeout 4m --logger "trx;LogFileName=integration-full.trx" --results-directory TestResults
      - name: Preserve complete test report and hang evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr17-full-server-tests
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 7
